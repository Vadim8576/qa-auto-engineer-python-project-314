[project]
name = "qa-auto-engineer-python-project-314"
version = "0.1.0"
description = "Testing a Kanban Board with Selenium"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kanban_board_tests"]

[project.scripts]
my-app = "kanban_board_tests.scripts.main:main"
