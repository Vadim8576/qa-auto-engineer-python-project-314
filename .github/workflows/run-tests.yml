jobs:
  build:
    runs-on: ubuntu-latest
    services:
      app:
        image: hexletprojects/qa_auto_python_testing_kanban_board_project_ru_app
        ports:
          - 5173:5173
        options: >-
          --health-cmd="curl -f http://localhost:5173/ || exit 1"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Run tests
        run: |
          uv run python -m pytest
        env:
          APP_BASE_URL: http://localhost:5173
          SELENIUM_MANAGER_DISABLE: 'true'