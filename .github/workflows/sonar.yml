name: Sonar

on:
  - push
  - pull_request

jobs:
  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync --group dev
      - name: Start app container
        run: |
          docker run --rm -d -p 5173:5173 hexletprojects/qa_auto_python_testing_kanban_board_project_ru_app
      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 || true)
            if [ "$status" != "000" ]; then
              echo "App is ready (status: $status)"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done
          echo "App did not start in time"
          docker logs $(docker ps -q --filter ancestor=hexletprojects/qa_auto_python_testing_kanban_board_project_ru_app)
          exit 1
      - name: Run tests to generate coverage report
        run: |
          uv run pytest --cov=gendiff --cov-report=xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
